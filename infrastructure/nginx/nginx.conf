worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging format ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;  # Cho phép upload file lớn

    # --- Rate Limiting ---
    # Chung: 10 request/giây/IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upload (POST/PUT tới .../documents): 2 request/giây/IP. Khóa rỗng = không giới hạn,
    # nên các request GET danh sách tài liệu KHÔNG bị tính vào hạn mức upload.
    map "$request_method:$uri" $upload_key {
        default "";
        "~^(?:POST|PUT):/api/(?:dept/[a-z0-9_]+|hr|acc)/documents" $binary_remote_addr;
    }
    limit_req_zone $upload_key zone=upload_limit:10m rate=2r/s;

    # --- Load configs ---
    include /etc/nginx/conf.d/*.conf;
}
