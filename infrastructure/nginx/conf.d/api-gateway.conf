# ============================================================
# API Gateway (v2)
# ============================================================
# * Định tuyến theo TÊN: /api/dept/<code>/...  ->  dept-<code>:3000 (DNS của Docker).
#   Thêm phòng ban mới KHÔNG cần sửa file này (R3): container dept-<code> tự có route.
# * Dùng named capture (?<tên>...) thay cho $1/$2: regex của khối `map` trong nginx.conf sẽ ghi đè $1/$2.
# * Dùng biến + resolver nên nginx vẫn khởi động khi một node chưa chạy, và tự tìm thấy node
#   mới sau tối đa 10 giây.
# * Không còn host.docker.internal: gọi thẳng service trong mạng dms-network.
# ============================================================

# DNS nội bộ của Docker
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # Trả HTTP 429 thay vì 503 khi vi phạm rate limit
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # --- Health của Gateway ---
    location /health {
        default_type application/json;
        return 200 '{"status": "ok", "service": "api-gateway"}';
    }

    # --- Chặn route nội bộ và metrics từ bên ngoài ---
    location ~ ^/(internal|metrics)(/|$)                    { return 403; }
    location ~ ^/api/dept/[a-z0-9_]+/(internal|metrics)(/|$) { return 403; }
    location ~ ^/api/(hr|acc)/(internal|metrics)(/|$)       { return 403; }
    location ~ ^/api/search/(internal|metrics)(/|$)         { return 403; }
    # Đăng ký/heartbeat của node chỉ dành cho mạng nội bộ (đã có service token, chặn thêm ở biên)
    location ~ ^/api/registry/(register|heartbeat|deregister|internal)(/|$) { return 403; }

    # === Tìm kiếm liên hợp + chia sẻ + Ban Giám đốc ===
    location ~ ^/api/search(?<search_rest>/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        set $search_upstream "search-engine-service:3003";
        proxy_pass http://$search_upstream/search$search_rest$is_args$args;
        proxy_connect_timeout 2s;                       # một bản chết: không chờ lâu
        proxy_next_upstream error timeout http_502 http_503;  # thử bản còn sống
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # === Registry phòng ban (danh sách động) ===
    location ~ ^/api/registry/(?<registry_rest>.*)$ {
        limit_req zone=api_limit burst=20 nodelay;
        set $search_upstream "search-engine-service:3003";
        proxy_pass http://$search_upstream/registry/$registry_rest$is_args$args;
        proxy_connect_timeout 2s;                       # một bản chết: không chờ lâu
        proxy_next_upstream error timeout http_502 http_503;  # thử bản còn sống
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # === Node phòng ban: /api/dept/<code>/<path> -> dept-<code>:3000/<path> ===
    location ~ ^/api/dept/(?<dept_code>[a-z][a-z0-9_]*)/(?<dept_rest>.*)$ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req zone=upload_limit burst=5 nodelay;
        set $dept_upstream "dept-${dept_code}:3000";
        proxy_pass http://$dept_upstream/$dept_rest$is_args$args;
        include /etc/nginx/conf.d/proxy-headers.inc;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
        # Nhiều bản sao cùng alias (Docker DNS trả nhiều IP): một bản chết thì thử bản còn lại ngay
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # --- Tương thích cũ: /api/hr/... và /api/acc/... ---
    location ~ ^/api/(?<legacy_dept>hr|acc)/(?<legacy_rest>.*)$ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req zone=upload_limit burst=5 nodelay;
        set $dept_upstream "dept-${legacy_dept}:3000";
        proxy_pass http://$dept_upstream/$legacy_rest$is_args$args;
        include /etc/nginx/conf.d/proxy-headers.inc;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # --- Giao diện web ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
