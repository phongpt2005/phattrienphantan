# ============================================================
# PostgreSQL Custom Configuration - Replica DB
# ============================================================
# Replica chỉ đọc, nhận streaming replication từ Primary
# ============================================================

# --- Replica mode ---
hot_standby = on
hot_standby_feedback = on

# --- Connection ---
listen_addresses = '*'
max_connections = 100

# --- WAL receiver ---
wal_receiver_timeout = 60s

# --- Performance (Replica nhẹ hơn Primary) ---
shared_buffers = 64MB
effective_cache_size = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB

# --- Logging ---
log_statement = 'mod'
log_timezone = 'Asia/Ho_Chi_Minh'
timezone = 'Asia/Ho_Chi_Minh'
