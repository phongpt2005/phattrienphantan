# ============================================================
# PostgreSQL Custom Configuration - Node Phòng ban (Primary)
# ============================================================
# Bật Logical Replication để Debezium đọc WAL
# Đây KHÔNG phải config mặc định - phải set thủ công
# ============================================================

# --- WAL Configuration (BẮT BUỘC cho Debezium CDC) ---
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# --- Logical Replication ---
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2

# --- Connection ---
listen_addresses = '*'
max_connections = 100

# --- Performance (tối ưu cho container ~512MB RAM) ---
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- Logging ---
log_statement = 'mod'
log_connections = on
log_disconnections = on
log_timezone = 'Asia/Ho_Chi_Minh'
timezone = 'Asia/Ho_Chi_Minh'
