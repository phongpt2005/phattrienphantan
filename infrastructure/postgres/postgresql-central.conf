# ============================================================
# PostgreSQL Custom Configuration - Central Search DB
# ============================================================
# Database trung tâm tìm kiếm - tối ưu cho Full-Text Search
# Không cần wal_level=logical vì DB này là consumer, không publish CDC
# ============================================================

# --- Connection ---
listen_addresses = '*'
max_connections = 100

# --- Performance (tối ưu cho read-heavy + full-text search) ---
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- WAL (chỉ cần cho Replication nội bộ, không cần logical) ---
wal_level = replica
max_wal_senders = 5
wal_keep_size = 512MB

# --- Logging ---
log_statement = 'mod'
log_connections = on
log_disconnections = on
log_timezone = 'Asia/Ho_Chi_Minh'
timezone = 'Asia/Ho_Chi_Minh'
