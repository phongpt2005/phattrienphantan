# Cổng nội bộ của phòng HR (edge). Nằm trên mạng riêng dms-site-hr nên vẫn truy cập được khi đường lên bị cắt.
# Feature 4: có 2 bản sao (dept-hr, dept-hr-2) cùng alias "dept-hr". "resolve" đọc lại DNS của Docker khi
# bản sao được tạo lại (IP đổi), và proxy_next_upstream chuyển request sang bản còn sống khi một bản đang nâng cấp.
resolver 127.0.0.11 valid=2s ipv6=off;

upstream dept_hr {
    zone dept_hr 64k;
    server dept-hr:3000 resolve max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # /internal/* chỉ dành cho dịch vụ nội bộ (có service token). Không được proxy ra cổng này (AGENTS.md mục 4).
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://dept_hr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 3s;
    }
}
