global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/targets/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Search Gateway và content-worker chạy nhiều bản: dns_sd trả về MỌI bản đang sống của service
  - job_name: 'dms-search-engine-service'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['search-engine-service']
        type: A
        port: 3003
        refresh_interval: 5s
    relabel_configs:
      - target_label: service
        replacement: search-engine-service

  # P0.3: độ trễ hàng đợi Kafka (kafka_consumergroup_lag) cho Projector, content-indexer và cảnh báo
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: kafka

  - job_name: 'dms-content-worker'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['content-worker']
        type: A
        port: 3010
        refresh_interval: 5s
    relabel_configs:
      - target_label: service
        replacement: content-worker

  # Cụm etcd của Patroni: độ trễ ghi đĩa (etcd_disk_wal_fsync_duration_seconds) quyết định tốc độ chuyển máy chính.
  # Đo 2026-11-27: đĩa dùng chung bị nghẽn, fdatasync 1,4-4,7 giây, một lần chuyển máy chính mất 46 giây.
  - job_name: 'etcd'
    static_configs:
      - targets: ['central-etcd:2379', 'central-etcd-2:2379', 'central-etcd-3:2379']
        labels:
          service: etcd

  # Patroni: vai trò từng node (patroni_primary), để cảnh báo khi một cụm không có máy chính
  - job_name: 'patroni'
    static_configs:
      - targets: ['central-pg-1:8008', 'central-pg-2:8008', 'hr-pg-1:8008', 'hr-pg-2:8008']
        labels:
          service: patroni

  # Mọi node phòng ban: Prometheus tự nạp lại file trong targets/ (file_sd).
  # Thêm phòng ban mới = scripts/add-department.sh ghi thêm 1 file <code>.json, không sửa file này.
  - job_name: 'dms-departments'
    metrics_path: '/metrics'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 10s
