# Cổng CSDL cho một cụm Patroni 3 node (cụm 3 máy, Swarm). Tên 3 node lấy từ biến môi trường PG_NODE_1..3.
#   5432: luôn tới máy chính (GET /primary trả 200 chỉ ở máy chính): ghi và Debezium.
#   5433: đọc từ bản sao trễ dưới 16 MB; không còn bản sao thì đọc ở máy chính.
# Chạy dạng global (mỗi máy một bản); ứng dụng nối tên service, Swarm đưa tới bản còn sống.
global
  maxconn 400
  log stdout format raw local0 notice

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  retries 2

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend rw
  bind *:5432
  default_backend primary

frontend ro
  bind *:5433
  use_backend replica if { nbsrv(replica) gt 0 }
  default_backend primary

backend primary
  option httpchk OPTIONS /primary
  http-check expect status 200
  # Node bị hạ khỏi vai trò máy chính: ngắt phiên cũ ngay để ứng dụng và Debezium nối lại máy chính mới
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server n1 "${PG_NODE_1}:5432" check port 8008 resolvers docker init-addr last,libc,none
  server n2 "${PG_NODE_2}:5432" check port 8008 resolvers docker init-addr last,libc,none
  server n3 "${PG_NODE_3}:5432" check port 8008 resolvers docker init-addr last,libc,none

backend replica
  option httpchk OPTIONS /replica?lag=16MB
  http-check expect status 200
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server n1 "${PG_NODE_1}:5432" check port 8008 resolvers docker init-addr last,libc,none
  server n2 "${PG_NODE_2}:5432" check port 8008 resolvers docker init-addr last,libc,none
  server n3 "${PG_NODE_3}:5432" check port 8008 resolvers docker init-addr last,libc,none

# Trạng thái HAProxy (chỉ trong mạng nội bộ)
frontend stats
  mode http
  bind *:8404
  http-request return status 200 content-type text/plain string "ok" if { path /health }
  stats enable
  stats uri /stats
