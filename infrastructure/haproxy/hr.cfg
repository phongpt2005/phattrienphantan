# P2 N2: cổng CSDL phòng HR. Tới node Patroni bằng tên *-site (chỉ có trên mạng site-hr): kết nối nội bộ site
# không đi qua mạng chung, đứt mạng chung không làm treo kết nối CSDL của node HR.
#   5432: luôn tới máy chính của cụm Patroni dms-hr (GET /primary trả 200 chỉ ở máy chính) - ghi và Debezium.
#   5433: đọc từ bản sao (GET /replica, trễ dưới 16 MB); không còn bản sao thì đọc ở máy chính.
global
  maxconn 300
  log stdout format raw local0 notice

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  retries 2

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend hr_rw
  bind *:5432
  default_backend hr_primary

frontend hr_ro
  bind *:5433
  use_backend hr_replica if { nbsrv(hr_replica) gt 0 }
  default_backend hr_primary

backend hr_primary
  option httpchk OPTIONS /primary
  http-check expect status 200
  # Node bị hạ khỏi vai trò máy chính: ngắt phiên cũ ngay, để ứng dụng và Debezium nối lại máy chính mới
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server hr-pg-1 hr-pg-1-site:5432 check port 8008 resolvers docker init-addr last,libc,none
  server hr-pg-2 hr-pg-2-site:5432 check port 8008 resolvers docker init-addr last,libc,none

backend hr_replica
  option httpchk OPTIONS /replica?lag=16MB
  http-check expect status 200
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server hr-pg-1 hr-pg-1-site:5432 check port 8008 resolvers docker init-addr last,libc,none
  server hr-pg-2 hr-pg-2-site:5432 check port 8008 resolvers docker init-addr last,libc,none
