# P1 B2: luôn đưa kết nối tới máy chính của cụm Patroni (GET /primary trả 200 chỉ ở máy chính).
global
  maxconn 300
  log stdout format raw local0 notice

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  retries 2

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend central_rw
  bind *:5432
  default_backend central_primary

backend central_primary
  option httpchk OPTIONS /primary
  http-check expect status 200
  # Node bị hạ khỏi vai trò máy chính: ngắt phiên cũ ngay, để ứng dụng nối lại máy chính mới
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
  server central-pg-1 central-pg-1:5432 check port 8008 resolvers docker init-addr last,libc,none
  server central-pg-2 central-pg-2:5432 check port 8008 resolvers docker init-addr last,libc,none
