# Cổng kho tệp (MinIO phân tán 3 máy, Swarm). Mỗi máy một bản; chia yêu cầu S3 cho các node MinIO còn sống.
global
  maxconn 2000
  log stdout format raw local0 notice

defaults
  mode http
  log global
  timeout connect 2s
  timeout client 5m
  timeout server 5m
  timeout check 2s
  retries 2
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend s3
  bind *:9000
  default_backend minio

backend minio
  balance leastconn
  option httpchk GET /minio/health/live
  http-check expect status 200
  default-server inter 2s fall 2 rise 1
  server minio-1 minio-1:9000 check resolvers docker init-addr last,libc,none
  server minio-2 minio-2:9000 check resolvers docker init-addr last,libc,none
  server minio-3 minio-3:9000 check resolvers docker init-addr last,libc,none

frontend health
  bind *:8404
  http-request return status 200 content-type text/plain string "ok"
