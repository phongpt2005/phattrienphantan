# Cân bằng tải trước 2 gateway nginx (P3, bổ sung thành phần). Một gateway lỗi thì yêu cầu đi gateway còn lại.
global
  maxconn 2000
  log stdout format raw local0 notice

defaults
  mode http
  log global
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout check 2s
  retries 2
  option redispatch

resolvers docker
  nameserver dns1 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend gateway_vip
  bind *:80
  default_backend gateways

backend gateways
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  default-server inter 2s fall 2 rise 1
  server nginx   nginx:80   check resolvers docker init-addr last,libc,none
  server nginx-2 nginx-2:80 check resolvers docker init-addr last,libc,none
