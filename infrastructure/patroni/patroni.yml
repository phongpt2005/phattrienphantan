# Cấu hình chung cho các node CSDL trung tâm. Tên node, địa chỉ, tài khoản và mật khẩu lấy từ biến môi trường PATRONI_*
# (không ghi bí mật vào tệp này).
scope: dms-central

bootstrap:
  dcs:
    # Chuyển máy chính trong khoảng 30 giây (mục tiêu B2). ttl >= loop_wait + 2 * retry_timeout.
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    # Mất etcd: máy chính vẫn ghi được nếu mọi node còn thấy nhau (một etcd không thành điểm chết của CSDL)
    failsafe_mode: true
    # Ghi chờ bản sao xác nhận (yêu cầu xin quyền không phát lại được từ Kafka).
    # strict = false: bản sao chết thì lùi về bất đồng bộ, không dừng ghi.
    synchronous_mode: true
    synchronous_mode_strict: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        effective_cache_size: 256MB
        work_mem: 8MB
        maintenance_work_mem: 64MB
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 256MB
        wal_log_hints: "on"
        hot_standby: "on"
        log_connections: "off"
        log_timezone: Asia/Ho_Chi_Minh
        timezone: Asia/Ho_Chi_Minh
  initdb:
    - encoding: UTF8
    - locale: en_US.utf8
    - data-checksums

postgresql:
  data_dir: /var/lib/postgresql/data/pgroot
  bin_dir: /usr/local/bin
  use_unix_socket: true
  use_unix_socket_repl: false
  parameters:
    unix_socket_directories: /var/run/postgresql
  pg_hba:
    - local all all trust
    - host replication all 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

watchdog:
  mode: "off"
