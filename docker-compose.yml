# ============================================================
# DOCKER COMPOSE - HỆ THỐNG QUẢN LÝ TÀI LIỆU PHÂN TÁN
# ============================================================
# Tất cả service nằm chung 1 Bridge Network: dms-network
# Gọi nhau qua container name, KHÔNG dùng IP tĩnh
# ============================================================
# RAM ước tính tổng: ~6-8GB
#   - PostgreSQL x6 (3 Primary + 3 Replica): ~2.5GB
#   - Kafka (KRaft): ~1GB
#   - Debezium: ~512MB
#   - MinIO x2: ~512MB
#   - Redis: ~128MB
#   - Nginx: ~64MB
# ============================================================

x-department-env: &department-env
  NODE_ENV: production
  PORT: 3000
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  REGISTRY_URL: http://search-engine-service:3003
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318   # tracing; tên service tự suy ra: dept-<code>
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
  DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
  DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
  # Redis chỉ dùng để ghi khóa thu hồi token (tv:<phòng>:<userId>); không dùng cho đọc/ghi nghiệp vụ
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

# Một image duy nhất cho MỌI phòng ban; DEPT_CODE + DATABASE_URL + MINIO_* quyết định phòng ban.
x-department-service: &department-service
  build:
    context: .
    dockerfile: services/department-service/Dockerfile
  image: dms/department-service:2.0
  restart: unless-stopped
  networks:
    - dms-network
  deploy:
    resources:
      limits:
        memory: 384M

services:

  # ================================================================
  #                    POSTGRESQL - NODE PHÒNG NHÂN SỰ (HR)
  # ================================================================

  # --- Primary DB ---
  postgres-hr-primary:
    image: postgres:16-alpine
    container_name: postgres-hr-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_HR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HR_PASSWORD}
      POSTGRES_DB: ${POSTGRES_HR_DB}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-hr-primary:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
      - ./infrastructure/postgres/init-scripts/node/01-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_HR_USER} -d ${POSTGRES_HR_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
      - site-hr
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Replica DB ---
  postgres-hr-replica:
    image: postgres:16-alpine
    container_name: postgres-hr-replica
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_REPLICATION_USER}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-hr-replica:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
    command: |
      sh -c "
        until pg_isready -h postgres-hr-primary -p 5432 -U ${POSTGRES_REPLICATION_USER}; do
          echo 'Chờ HR Primary...'
          sleep 2
        done

        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo '>>> Tạo base backup từ HR Primary...'
          rm -rf /var/lib/postgresql/data/*
          su-exec postgres pg_basebackup -h postgres-hr-primary -p 5432 -U ${POSTGRES_REPLICATION_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R
          cp /etc/postgresql/postgresql.conf /var/lib/postgresql/data/postgresql.conf
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
          echo '>>> Base backup hoàn tất.'
        fi

        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        exec su-exec postgres postgres -c config_file=/var/lib/postgresql/data/postgresql.conf
      "
    depends_on:
      postgres-hr-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPLICATION_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - site-hr
    deploy:
      resources:
        limits:
          memory: 256M

  # ================================================================
  #                POSTGRESQL - NODE PHÒNG KẾ TOÁN (ACCOUNTING)
  # ================================================================

  # --- Primary DB ---
  postgres-acc-primary:
    image: postgres:16-alpine
    container_name: postgres-acc-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ACC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ACC_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ACC_DB}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-acc-primary:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
      - ./infrastructure/postgres/init-scripts/node/01-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ACC_USER} -d ${POSTGRES_ACC_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Replica DB ---
  postgres-acc-replica:
    image: postgres:16-alpine
    container_name: postgres-acc-replica
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_REPLICATION_USER}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-acc-replica:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
    command: |
      sh -c "
        until pg_isready -h postgres-acc-primary -p 5432 -U ${POSTGRES_REPLICATION_USER}; do
          echo 'Chờ Accounting Primary...'
          sleep 2
        done

        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo '>>> Tạo base backup từ Accounting Primary...'
          rm -rf /var/lib/postgresql/data/*
          su-exec postgres pg_basebackup -h postgres-acc-primary -p 5432 -U ${POSTGRES_REPLICATION_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R
          cp /etc/postgresql/postgresql.conf /var/lib/postgresql/data/postgresql.conf
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
          echo '>>> Base backup hoàn tất.'
        fi

        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        exec su-exec postgres postgres -c config_file=/var/lib/postgresql/data/postgresql.conf
      "
    depends_on:
      postgres-acc-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPLICATION_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ================================================================
  #              POSTGRESQL - TRUNG TÂM TÌM KIẾM (CENTRAL)
  # ================================================================

  # --- Primary DB ---
  postgres-central-primary:
    image: postgres:16-alpine
    container_name: postgres-central-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_CENTRAL_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CENTRAL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CENTRAL_DB}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-central-primary:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-central.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/replication/init-replication.sh:/docker-entrypoint-initdb.d/01-init-replication.sh:ro
      - ./infrastructure/postgres/init-scripts/central/01-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CENTRAL_USER} -d ${POSTGRES_CENTRAL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Replica DB ---
  postgres-central-replica:
    image: postgres:16-alpine
    container_name: postgres-central-replica
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_REPLICATION_USER}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata-central-replica:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
    command: |
      sh -c "
        until pg_isready -h postgres-central-primary -p 5432 -U ${POSTGRES_REPLICATION_USER}; do
          echo 'Chờ Central Primary...'
          sleep 2
        done

        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo '>>> Tạo base backup từ Central Primary...'
          rm -rf /var/lib/postgresql/data/*
          su-exec postgres pg_basebackup -h postgres-central-primary -p 5432 -U ${POSTGRES_REPLICATION_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R
          cp /etc/postgresql/postgresql.conf /var/lib/postgresql/data/postgresql.conf
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
          echo '>>> Base backup hoàn tất.'
        fi

        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        exec su-exec postgres postgres -c config_file=/var/lib/postgresql/data/postgresql.conf
      "
    depends_on:
      postgres-central-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPLICATION_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ================================================================
  #                   MINIO - FILE STORAGE NODE HR
  # ================================================================
  minio-hr:
    image: quay.io/minio/minio:latest
    container_name: minio-hr
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_HR_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_HR_ROOT_PASSWORD}
    volumes:
      - minio-hr-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - site-hr
    deploy:
      resources:
        limits:
          memory: 256M

  # ================================================================
  #              MINIO - FILE STORAGE NODE ACCOUNTING
  # ================================================================
  minio-acc:
    image: quay.io/minio/minio:latest
    container_name: minio-acc
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACC_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ACC_ROOT_PASSWORD}
    volumes:
      - minio-acc-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ================================================================
  #                   REDIS - CACHE CHO SEARCH ENGINE
  # ================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 192M

  # ================================================================
  #                APACHE KAFKA (KRaft - Không cần Zookeeper)
  # ================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      # --- KRaft Configuration ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}

      # --- Listeners ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_BROKER_PORT},PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_BROKER_PORT},PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Cluster ---
      CLUSTER_ID: 'dms-kafka-cluster-2024'

      # --- Topic defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

      # --- Log retention ---
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_BROKER_PORT} > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 1024M

  # ================================================================
  #              DEBEZIUM - KAFKA CONNECT (CDC Pipeline)
  # ================================================================
  debezium:
    image: quay.io/debezium/connect:2.7
    container_name: debezium
    restart: unless-stopped
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      BOOTSTRAP_SERVERS: kafka:${KAFKA_BROKER_PORT}
      # Danh tính ổn định theo tên (mặc định là IP container, đổi sau mỗi lần tạo lại -> connector kẹt UNASSIGNED)
      ADVERTISED_HOST_NAME: debezium

      # Replication factor = 1 cho dev (single broker)
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      postgres-hr-primary:
        condition: service_healthy
      postgres-acc-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 768M

  # ================================================================
  #              NGINX - API GATEWAY + LOAD BALANCER
  # ================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - kafka
      - redis
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 64M

  # ================================================================
  #     NODE PHÒNG NHÂN SỰ (HR) - image department-service dùng chung
  # ================================================================
  dept-hr:
    <<: *department-service
    container_name: dept-hr
    environment:
      <<: *department-env
      DEPT_CODE: HR
      DEPT_NAME: "Phòng Nhân sự"
      DATABASE_URL: postgresql://${POSTGRES_HR_USER}:${POSTGRES_HR_PASSWORD}@postgres-hr-primary:5432/${POSTGRES_HR_DB}?schema=public
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_HR_USER}:${POSTGRES_HR_PASSWORD}@postgres-hr-replica:5432/${POSTGRES_HR_DB}?schema=public
      MINIO_ENDPOINT: minio-hr
      MINIO_ACCESS_KEY: ${MINIO_HR_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_HR_ROOT_PASSWORD}
      MINIO_BUCKET: hr-documents
    networks:
      - dms-network
      - site-hr
    depends_on:
      postgres-hr-primary:
        condition: service_healthy
      minio-hr:
        condition: service_healthy

  # Bản sao thứ 2 của node HR (Feature 4). Cùng CSDL và MinIO. Cả hai mang alias "dept-hr" trên cả hai mạng,
  # nên Docker DNS trả về cả hai địa chỉ; nginx và edge tự phân tải. Không seed người dùng demo (bản 1 đã seed).
  dept-hr-2:
    <<: *department-service
    container_name: dept-hr-2
    environment:
      <<: *department-env
      DEPT_CODE: HR
      DEPT_NAME: "Phòng Nhân sự"
      SEED_DEMO_USERS: "false"
      DATABASE_URL: postgresql://${POSTGRES_HR_USER}:${POSTGRES_HR_PASSWORD}@postgres-hr-primary:5432/${POSTGRES_HR_DB}?schema=public
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_HR_USER}:${POSTGRES_HR_PASSWORD}@postgres-hr-replica:5432/${POSTGRES_HR_DB}?schema=public
      MINIO_ENDPOINT: minio-hr
      MINIO_ACCESS_KEY: ${MINIO_HR_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_HR_ROOT_PASSWORD}
      MINIO_BUCKET: hr-documents
    networks:
      dms-network:
        aliases: [dept-hr]
      site-hr:
        aliases: [dept-hr]
    depends_on:
      postgres-hr-primary:
        condition: service_healthy
      minio-hr:
        condition: service_healthy

  # ================================================================
  #           NODE PHÒNG KẾ TOÁN (ACC) - cùng image với HR
  # ================================================================
  dept-acc:
    <<: *department-service
    container_name: dept-acc
    environment:
      <<: *department-env
      DEPT_CODE: ACC
      DEPT_NAME: "Phòng Kế toán"
      DATABASE_URL: postgresql://${POSTGRES_ACC_USER}:${POSTGRES_ACC_PASSWORD}@postgres-acc-primary:5432/${POSTGRES_ACC_DB}?schema=public
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_ACC_USER}:${POSTGRES_ACC_PASSWORD}@postgres-acc-replica:5432/${POSTGRES_ACC_DB}?schema=public
      MINIO_ENDPOINT: minio-acc
      MINIO_ACCESS_KEY: ${MINIO_ACC_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ACC_ROOT_PASSWORD}
      MINIO_BUCKET: accounting-documents
    depends_on:
      postgres-acc-primary:
        condition: service_healthy
      minio-acc:
        condition: service_healthy

  # ================================================================
  #              SEARCH ENGINE SERVICE (READ ZONE)
  # ================================================================
  search-engine-service:
    build:
      context: .
      dockerfile: services/search-engine-service/Dockerfile
    image: dms/search-engine-service:2.0
    # KHÔNG đặt container_name và KHÔNG publish cổng: service chạy NHIỀU bản (stateless) sau nginx.
    # Đổi số bản: docker compose up -d --no-build --scale search-engine-service=3
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_CENTRAL_USER}:${POSTGRES_CENTRAL_PASSWORD}@postgres-central-primary:5432/${POSTGRES_CENTRAL_DB}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: index-projector
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CACHE_TTL: 300
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SEARCH_NODE_TIMEOUT_MS: 800
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: search-gateway
      UV_THREADPOOL_SIZE: 16   # phân giải tên máy treo (CSDL sập) không được chặn lệnh gọi tới các node
      PROMETHEUS_URL: http://prometheus:9090   # trang giám sát của Ban Giám đốc đọc số bản đang sống, cảnh báo
      DEBEZIUM_URL: http://debezium:8083       # ... và trạng thái connector
    depends_on:
      postgres-central-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dms-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 384M

  # ================================================================
  #   CONTENT-WORKER: lập chỉ mục NỘI DUNG TỆP qua hàng đợi Kafka
  #   Consumer group `content-indexer`: tăng số bản để chia partition (scale ngang)
  #     docker compose up -d --no-build --scale content-worker=3
  # ================================================================
  content-worker:
    build:
      context: .
      dockerfile: services/content-worker/Dockerfile
    image: dms/content-worker:2.0
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: content-indexer
      REGISTRY_URL: http://search-engine-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dms-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ================================================================
  #   HR-SITE-EDGE: cổng nội bộ của phòng HR (nằm trên mạng riêng, không phụ thuộc đường lên)
  # ================================================================
  hr-site-edge:
    image: nginx:alpine
    container_name: hr-site-edge
    restart: unless-stopped
    volumes:
      - ./infrastructure/site/hr-edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SVC_HR_PORT}:80"
    depends_on:
      dept-hr:
        condition: service_healthy
    networks:
      - site-hr
    deploy:
      resources:
        limits:
          memory: 64M

  # ================================================================
  #   CONNECTOR-WATCHDOG: tự restart task Debezium bị FAILED (ví dụ sau khi mất CSDL lúc khởi động)
  # ================================================================
  connector-watchdog:
    image: quay.io/debezium/connect:2.7
    container_name: connector-watchdog
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          for c in $$(curl -s http://debezium:8083/connectors | tr -d '[]"' | tr ',' ' '); do
            if curl -s http://debezium:8083/connectors/$$c/status | grep -q FAILED; then
              echo "$$(date -u +%H:%M:%S) restart $$c (task FAILED)"
              curl -s -X POST "http://debezium:8083/connectors/$$c/restart?includeTasks=true&onlyFailed=true" > /dev/null
            fi
          done
          sleep 10
        done
    depends_on:
      debezium:
        condition: service_healthy
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 64M

  # ================================================================
  #   CONNECT-INIT: đăng ký connector Debezium Outbox (chạy 1 lần rồi thoát)
  #   Thêm phòng ban mới: scripts/add-department.sh (không sửa file này)
  # ================================================================
  connect-init:
    image: quay.io/debezium/connect:2.7
    container_name: connect-init
    restart: "no"
    entrypoint: ["/bin/sh", "/register-connectors.sh"]
    environment:
      CONNECT_URL: http://debezium:8083
      REPL_USER: ${POSTGRES_REPLICATION_USER}
      REPL_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      RESYNC_AFTER_REGISTER: "true"
      CONNECTORS: "HR:postgres-hr-primary:${POSTGRES_HR_DB},ACC:postgres-acc-primary:${POSTGRES_ACC_DB}"
    volumes:
      - ./infrastructure/debezium/register-connectors.sh:/register-connectors.sh:ro
      - ./infrastructure/debezium/connector-template.json:/connector-template.json:ro
    depends_on:
      debezium:
        condition: service_healthy
    networks:
      - dms-network

  # ================================================================
  #                 PHASE 6: MONITORING (PROMETHEUS & GRAFANA)
  # ================================================================

  # Distributed tracing: nhận OTLP từ các service, giao diện tại http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"   # lưu trong bộ nhớ, đủ cho demo
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

  # P0.3: metric độ trễ consumer group (kafka_consumergroup_lag). Chỉ trong mạng nội bộ, không publish cổng.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    restart: unless-stopped
    command:
      - '--kafka.server=kafka:${KAFKA_BROKER_PORT}'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - dms-network
    deploy:
      resources:
        limits:
          memory: 256M

# ================================================================
#                        DOCKER NETWORK
# ================================================================
networks:
  dms-network:
    driver: bridge
    name: dms-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Mạng riêng của phòng HR: DB, replica, MinIO và node. Cắt đường lên (dms-network) không làm mất kết nối nội bộ này.
  site-hr:
    driver: bridge
    name: dms-site-hr
    ipam:
      config:
        - subnet: 172.29.10.0/24

# ================================================================
#                       PERSISTENT VOLUMES
# ================================================================
volumes:
  # PostgreSQL Data
  pgdata-hr-primary:
    name: dms-pgdata-hr-primary
  pgdata-hr-replica:
    name: dms-pgdata-hr-replica
  pgdata-acc-primary:
    name: dms-pgdata-acc-primary
  pgdata-acc-replica:
    name: dms-pgdata-acc-replica
  pgdata-central-primary:
    name: dms-pgdata-central-primary
  pgdata-central-replica:
    name: dms-pgdata-central-replica

  # MinIO Data
  minio-hr-data:
    name: dms-minio-hr-data
  minio-acc-data:
    name: dms-minio-acc-data

  # Redis Data
  redis-data:
    name: dms-redis-data

  # Kafka Data
  kafka-data:
    name: dms-kafka-data

  # Nginx Logs
  nginx-logs:
    name: dms-nginx-logs

  # Monitoring Data
  prometheus-data:
    name: dms-prometheus-data
  grafana-data:
    name: dms-grafana-data
